name: Bug report
description: Crashes, wrong behaviour, hook or Action problems.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Include the command and output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopscore version and platform
      placeholder: "slopscore 0.1.1, macOS 15 / Python 3.12"
    validations:
      required: true
